[versions]
agp = "8.5.0"
gson = "2.10.1"
hiltAndroid = "2.52"
hiltAndroidCompiler = "2.51.1"
hiltAndroidVersion = "2.51.1"
kotlin = "1.9.0"
coreKtx = "1.13.1"
junit = "4.13.2"
